<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Input</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="screen">
      <h1>Input</h1>
      <form class="input-form" action="#" method="get">
        <label class="field">
          <span>Name</span>
          <input
            type="text"
            name="name"
            placeholder="Enter name"
            required
          />
        </label>
        <label class="field">
          <span>Message</span>
          <textarea
            name="message"
            rows="4"
            placeholder="Enter message"
          ></textarea>
        </label>
        <div class="actions">
          <button class="primary-button" type="submit">Submit</button>
          <a class="secondary-button" href="index.html">Back to Top</a>
        </div>
      </form>
    </main>
  </body>
</html>
